{% extends "telegram_monitor/base.html" %}
{% block title %}{{ scope.label }} · History{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-4">
    <h2 class="text-lg font-semibold">{{ scope.label }} <span class="text-slate-400 font-normal">· History</span>
        <span class="text-sm font-normal text-slate-400">(latest 200 closed trades)</span></h2>
</div>

<p id="note" class="text-sm text-amber-700 mb-3 hidden"></p>

<section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <table class="w-full table-fixed text-xs xl:text-sm [overflow-wrap:anywhere]"><thead id="history-head" class="text-slate-400 text-[10px] uppercase tracking-wide"></thead><tbody id="history-body" class="divide-y divide-slate-100"></tbody></table>
    <div id="history-empty" class="text-slate-400 text-sm text-center py-10">No closed trades yet.</div>
</section>

<div id="trade-config" class="hidden"{% if scope.manual %} data-manual="1"{% endif %} data-history-url="{% url scope.slug|add:'-api-history' %}"></div>
<script src="/static/trading/js/common.js?v=4"></script>
<script src="/static/trading/js/history.js?v=2"></script>
{% endblock %}
